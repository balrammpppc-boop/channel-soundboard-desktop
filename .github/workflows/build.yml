name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build program
        run: pyinstaller --noconfirm --windowed --name ChannelSoundboard --icon icon.ico --add-data "icon.png;." --collect-all sounddevice --collect-all soundfile app.py
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ChannelSoundboard-Setup
          path: installer/ChannelSoundboard-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ChannelSoundboard-portable
          path: dist/ChannelSoundboard
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/ChannelSoundboard-Setup.exe
